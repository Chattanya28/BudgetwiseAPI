# Server Port
server.port=8080

# H2 Database Config
spring.datasource.url=jdbc:h2:mem:budgetwisedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Config (Table auto-create)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Secret & Expiration (1 day = 86400000 ms)
jwt.secret=budgetwisesecretkeybudgetwisesecretkeybudgetwisesec
jwt.expiration=86400000

# Custom Business Logic Config
budget.alert.threshold=0.80